<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创意发散 - Creative Muse</title>
</head>
<body>
  <div id="app">
    <!-- Dark mode toggle -->
    <button id="theme-toggle" class="theme-toggle" title="切换主题">🌙</button>

    <!-- Canvas area -->
    <div id="canvas-container">
      <svg id="edges-svg"></svg>
      <div id="nodes-layer"></div>
      <!-- Welcome state -->
      <div id="welcome-hint" class="welcome-hint">
        <span class="welcome-icon">✨</span>
        <span>输入一个词，开始发散联想</span>
      </div>
    </div>

    <!-- Input area -->
    <div id="input-area" class="input-area centered">
      <input
        id="word-input"
        type="text"
        placeholder="输入一个词..."
        autocomplete="off"
      />
      <button id="submit-btn" class="submit-btn">发散</button>
    </div>

    <!-- Zoom controls -->
    <div id="zoom-controls" class="zoom-controls">
      <button id="zoom-in" title="放大">+</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-out" title="缩小">−</button>
      <button id="fit-view" title="适应视图">⊡</button>
      <button id="clear-canvas" title="清空画布">✕</button>
    </div>

    <!-- Minimap -->
    <canvas id="minimap-canvas" width="160" height="100"></canvas>

    <!-- History toggle button -->
    <button id="history-toggle" class="history-toggle" title="历史记录">☰</button>

    <!-- Export button -->
    <button id="export-image" class="export-btn" title="导出图片">⬇</button>
    <button id="export-markdown" class="export-btn" title="导出MD" style="top:116px">📋</button>
    <button id="share-link" class="export-btn" title="分享链接" style="top:164px">🔗</button>

    <!-- History drawer -->
    <div id="history-drawer" class="history-drawer">
      <div class="history-header">
        <h3>历史记录</h3>
        <button id="history-close" class="close-btn">✕</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>

    <!-- History overlay (for closing drawer on outside click) -->
    <div id="history-overlay" class="history-overlay hidden"></div>

    <!-- Undo toast -->
    <div id="undo-toast" class="undo-toast hidden">已撤销</div>

    <!-- Pricing overlay -->
    <div id="pricing-overlay" class="pricing-overlay hidden">
      <div class="pricing-modal">
        <button id="pricing-close" class="pricing-close">✕</button>
        <h2 class="pricing-title">升级套餐</h2>
        <div class="pricing-cards">
          <!-- Free -->
          <div class="pricing-card current-plan" id="plan-free">
            <div class="pricing-plan-name">免费版</div>
            <div class="pricing-price"><span class="pricing-currency">¥</span>0<span class="pricing-period">/月</span></div>
            <button class="pricing-btn secondary" disabled>你当前的套餐</button>
            <ul class="pricing-features">
              <li><span class="pricing-check">✓</span> 核心模型</li>
              <li><span class="pricing-check">✓</span> 每天免费 5 次消息发散</li>
            </ul>
          </div>
          <!-- Basic -->
          <div class="pricing-card" id="plan-basic">
            <div class="pricing-plan-name">基础版</div>
            <div class="pricing-price"><span class="pricing-currency">¥</span>3.9<span class="pricing-period">/10次</span></div>
            <button class="pricing-btn primary" data-plan="basic">升级至基础版</button>
            <ul class="pricing-features">
              <li><span class="pricing-check">✓</span> 核心模型</li>
              <li><span class="pricing-check">✓</span> 畅聊 10 次，更多体验</li>
            </ul>
          </div>
          <!-- Pro -->
          <div class="pricing-card" id="plan-pro">
            <div class="pricing-badge">🔥 热门</div>
            <div class="pricing-plan-name">Pro 版</div>
            <div class="pricing-price"><span class="pricing-currency">¥</span>19.9<span class="pricing-period">/月</span></div>
            <button class="pricing-btn primary" data-plan="pro">升级至 Pro</button>
            <ul class="pricing-features">
              <li><span class="pricing-check">✓</span> 顶级模型</li>
              <li><span class="pricing-check">✓</span> 每天无限次消息发散</li>
              <li><span class="pricing-check">✓</span> 抢先体验实验性功能</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
